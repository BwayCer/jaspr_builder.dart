name: jaspr_css_file_builder
description: Builder for Jaspr to extract styleRules and generate standalone static CSS files.
version: 1.0.0
repository: https://github.com/BwayCer/jaspr_builder.dart
issue_tracker: https://github.com/BwayCer/jaspr_builder.dart/issues

environment:
  sdk: ^3.12.2

topics:
  - jaspr
  - web
  - css
  - build-runner

dependencies:
  analyzer: ^12.1.0
  build: ^4.0.7
  glob: ^2.1.3
  jaspr: ^0.23.2
  source_gen: ^4.2.3

dev_dependencies:
  build_test: ^3.5.16
  lints: ^6.1.0
  logging: ^1.3.0
  test: ^1.31.1
