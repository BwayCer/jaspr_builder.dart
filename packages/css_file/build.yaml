builders:
  css_file_module_builder:
    import: "package:jaspr_css_file_builder/builder.dart"
    builder_factories: ["cssFileModuleBuilder"]
    build_extensions:
      r'.dart': [".styles.cssfile.txt"]
    auto_apply: dependents
    build_to: cache
  css_file_builder:
    import: "package:jaspr_css_file_builder/builder.dart"
    builder_factories: ["cssFileBuilder"]
    build_extensions:
      r'$web$': [".css"]
    auto_apply: dependents
    build_to: source
    required_inputs:
      - ".styles.cssfile.txt"
